name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 环境诊断
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          command -v sdkmanager || true
          java -version

      - name: 接受 SDK 许可并安装 API 37 平台
        run: |
          SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ]; then
            SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR="$ANDROID_HOME/tools/bin/sdkmanager"
          fi
          echo "sdkmanager=$SDKMGR"
          "$SDKMGR" --version || true
          yes | "$SDKMGR" --licenses > /dev/null || true
          PLATS=$("$SDKMGR" --list 2>/dev/null | grep -o 'platforms;android-3[0-9]' | sort -u | tr '\n' ' ')
          echo "::notice::可用 Android 平台: $PLATS"
          : > /tmp/sdk-setup.log
          FAILED=""
          for pkg in "platforms;android-37" "build-tools;35.0.0" "platform-tools"; do
            if ! "$SDKMGR" "$pkg" >> /tmp/sdk-setup.log 2>&1; then
              FAILED="$pkg"
              break
            fi
          done
          "$SDKMGR" "build-tools;36.0.0" >> /tmp/sdk-setup.log 2>&1 || true
          if [ -n "$FAILED" ]; then
            echo "::error::安装包失败: $FAILED"
            SUMMARY=$(tr '\r\n' '  ' < /tmp/sdk-setup.log | tr -s ' ' | tr -d '%' | cut -c1-3000)
            echo "::error::SDK_LOG: $SUMMARY"
            exit 1
          fi

      - name: 解析 GeckoView 当前 Stable 版本
        id: gv
        run: |
          set -e
          curl -fsSL https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/maven-metadata.xml -o gv-metadata.xml
          VERSION=$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('gv-metadata.xml').getroot()
          v = root.findtext('versioning/release') or ''
          if not v:
              vs = [x.text for x in root.findall('versioning/versions/version')
                    if x.text and '-' not in x.text and 'a' not in x.text.split('.')[0]]
              v = sorted(vs)[-1] if vs else ''
          print(v.strip())
          PY
          )
          echo "GeckoView Stable: ${VERSION:-latest.release}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "GV_ARG="
            if [ -n "$VERSION" ]; then echo "GV_ARG=-Pgeckoview.version=$VERSION"; fi
          } >> "$GITHUB_ENV"

      - name: 校验 Mozilla Maven 可达性
        run: curl -fsSIL https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/maven-metadata.xml | head -5

      - name: 输出实际解析的 GeckoView 坐标
        run: gradle $GV_ARG :app:printGeckoViewCoordinate --no-daemon

      - name: 编译 Debug APK
        run: |
          set -o pipefail
          gradle $GV_ARG :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build-debug.log

      - name: 编译 Release APK（ABI 拆分 + R8 + 资源压缩）
        run: |
          set -o pipefail
          gradle $GV_ARG :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/build-release.log

      - name: 输出编译错误摘要
        if: failure()
        run: |
          for f in /tmp/build-debug.log /tmp/build-release.log; do
            [ -f "$f" ] || continue
            awk '/\* What went wrong:/{flag=1} flag{print; n++} n>=60{exit}' "$f" | while IFS= read -r line; do
              echo "::error::$(printf '%s' "$line" | cut -c1-280)"
            done
          done

      - name: 输出 APK 体积
        run: |
          echo "== Debug =="
          ls -lh app/build/outputs/apk/debug/*.apk || true
          echo "== Release (per ABI) =="
          ls -lh app/build/outputs/apk/release/*.apk || true

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: 上传 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-per-abi
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
