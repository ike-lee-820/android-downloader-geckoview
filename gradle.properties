org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableR8.fullMode=false
android.suppressUnsupportedCompileSdk=37
kotlin.code.style=official

# GeckoView 发布渠道：release 为 Stable，beta / nightly 为预发布渠道。
geckoview.channel=release

# 可复现构建时可钉住具体版本，取消下行注释并填入 maven.mozilla.org 上的实际版本号。
# geckoview.version=159.0.20261102144711
# 未钉住时使用 latest.release，构建时由 maven.mozilla.org 的 maven-metadata.xml 解析当前 Stable。
